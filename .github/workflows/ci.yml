name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  web:
    name: Web - typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build shared package
        run: npm run build --workspace=packages/shared

      - name: Typecheck web app
        run: npm run typecheck --workspace=apps/web

      - name: Lint web app
        run: npm run lint --workspace=apps/web

      - name: Test web app
        run: npm run test --workspace=apps/web

      - name: Build web app
        run: npm run build --workspace=apps/web

  firestore-rules:
    name: Validate Firestore & Storage rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Set up Java (required by the Firebase emulators)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate rules compile and emulators boot
        run: |
          npx firebase-tools emulators:exec \
            --project demo-helpdesk-ci \
            --only firestore,auth,storage \
            "echo 'Firestore/Storage/Auth emulators started successfully with the committed rules.'"
